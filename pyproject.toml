[project]
name = "avtalsagent"
version = "0.1.0"
description = "Agentic RAG over Statens inköpscentral framework agreements, with verified citations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.13",
    # Docling reads PDF and Word; models-local runs its layout and table models on PyTorch.
    "docling-slim[convert-core,format-docx,format-pdf,models-local]>=2.133",
    # The table model needs OpenCV, and its package leaves the build to us: headless,
    # without GUI libraries.
    "docling-ibm-models[opencv-python-headless]>=4.0.3",
    "httpx>=0.28.1",
    # OpenAI models through LangChain (ADR 0005). M4 uses one to choose section headings.
    "langchain-openai>=1.6.7",
    # Vectors in memory for the offline measurement of the search (evals/, M5).
    "numpy>=2.3",
    # Imported directly for its error type (ingestion/llm_title_matcher.py) and for
    # embeddings (retrieval/embedder.py, M5).
    "openai>=3.24",
    "openpyxl>=3.1.5",
    # pgvector's types in SQLAlchemy and psycopg: embeddings and BM25 weights (M5).
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pypdfium2>=5.0",
    # The Swedish stemmer of the search's word index (retrieval/swedish_text.py, M5). A new
    # major version changes stems, so the index records the version it was built with.
    "snowballstemmer>=3.1.1,<4",
    "sqlalchemy>=2.1.3",
    # Listed so that [tool.uv.sources] below picks their CPU build on Linux.
    "torch>=2.2.2",
    "torchvision>=0.17",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pillow>=11",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "python-docx>=1.2",
    "reportlab>=4.4",
    "ruff>=0.16",
    "testcontainers[postgres]>=4.15.0",
    "types-openpyxl>=3.1.5.20260827",
    "types-reportlab>=5.0.0.20260911",
]

[tool.uv]
# The platforms the project is locked for. Without this uv would also resolve PyTorch for
# platforms such as IBM Z (s390x) that nobody runs it on.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32'",
]

# PyPI's Linux build of PyTorch also installs several GB of CUDA libraries. The models run
# on the CPU, so on Linux PyTorch comes from PyTorch's own CPU index (ADR 0008). macOS and
# Windows get the CPU build from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes, I: import order, B: likely bugs, UP: modern syntax,
# SIM: simplifications, D: docstrings (every module explains What/Why/How).
select = ["E", "F", "I", "B", "UP", "SIM", "D"]
# Modules and packages must have a docstring (D100, D104). Classes and functions
# get one when they need explaining, so the rest of D1xx is off.
ignore = ["D101", "D102", "D103", "D105", "D106", "D107"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evals"]
# Module names come from these roots: src/avtalsagent -> avtalsagent, tests/... -> tests....
mypy_path = ["src", "."]
explicit_package_bases = true

# pypdfium2 ships without type information.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# docling_core re-exports its document model from docling_core.types.doc without __all__.
[[tool.mypy.overrides]]
module = ["docling_core.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import shared helpers with `from tests.conftest import ...`.
pythonpath = ["."]
addopts = "-ra --strict-markers"
