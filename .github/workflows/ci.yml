# Continuous integration: runs on every push and pull request.
# Five jobs, each answering one question:
#   lint       - does the code follow the style and type rules?
#   test       - do the tests pass?
#   compose    - does the whole system in docker-compose.yml build and start, on both processor
#                architectures (amd64, and arm64 as on a Mac with Apple silicon)?
#   web        - does the web app pass its checks and tests, and work in a browser?
#   web-docker - do the web app's container images work, as on the demo computer?
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    env:
      # The PDF tests need Docling's layout and table models. Locally they are skipped
      # when the models cannot be downloaded; in CI a missing model is an error.
      AVTALSAGENT_REQUIRE_MODELS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Cache Docling's models downloaded from Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked
      - run: uv run pytest

  compose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # A service that keeps restarting is waited on until the timeouts below, not for hours.
    timeout-minutes: 30
    env:
      # The API does not start without a key. This one is never sent: nothing here asks a question.
      OPENAI_API_KEY: sk-ci-not-a-real-key
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up -d postgres --wait
      - name: Check that pgvector is installed
        run: >
          docker compose exec -T postgres
          psql -U avtalsagent -d avtalsagent -tAc
          "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
          | grep -E '^[0-9]+\.[0-9]+'
      - name: Build the backend image
        run: docker compose build mcp
      - name: Create the tables, as the ingestion does first
        run: docker compose --profile ingest run --rm ingest alembic upgrade head
      - name: Start avtal-mcp and the API
        run: docker compose up -d --wait --wait-timeout 180 --no-build mcp api
      - name: Check the API
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/agui/health
          # No document is loaded, so any document is unknown: 404, not an error.
          sha=$(printf 'a%.0s' $(seq 64))
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/api/documents/$sha/pdf")" = 404
          # The checkpoint tables were created when the API opened its checkpointer.
          docker compose exec -T postgres psql -U avtalsagent -d avtalsagent -tAc "SELECT to_regclass('checkpoints')" | grep -x checkpoints
          # The upload store created its tables: a text file goes in, is listed and sent back to
          # its own thread only, and is deleted.
          printf 'Hej från CI.' > /tmp/ci.txt
          id=$(curl -fsS -F thread_id=ci -F file=@/tmp/ci.txt http://127.0.0.1:8000/api/uploads | jq -r .upload_id)
          curl -fsS "http://127.0.0.1:8000/api/uploads?thread_id=ci" | grep "$id"
          curl -fsS "http://127.0.0.1:8000/api/uploads/$id/file?thread_id=ci" | grep -x 'Hej från CI.'
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/api/uploads/$id/file?thread_id=other")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "http://127.0.0.1:8000/api/uploads/$id?thread_id=ci")" = 204
      - name: Build and start the web app
        run: |
          docker compose build web
          docker compose up -d --wait --wait-timeout 180 --no-build web
      - name: Check that the web app reaches the API
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          # The web app passes the PDF request on to the API inside compose; its 404 comes back.
          sha=$(printf 'a%.0s' $(seq 64))
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/api/documents/$sha/pdf")" = 404
      - name: Show the services' logs
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Starts the mock agent and the built app, then runs the browser tests against them.
      - run: npm run test:e2e

  web-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker compose -f compose.mock.yaml up -d --build --wait
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The same browser tests, against the containers instead of a local build.
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: always()
        run: docker compose -f compose.mock.yaml down
