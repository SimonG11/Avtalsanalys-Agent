# Continuous integration: runs on every push and pull request.
# Five jobs, each answering one question:
#   lint       - does the code follow the style and type rules?
#   test       - do the tests pass?
#   compose    - does the database in docker-compose.yml start, with pgvector?
#   web        - does the web app pass its checks and tests, and work in a browser?
#   web-docker - do the web app's container images work, as on the demo computer?
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    env:
      # The PDF tests need Docling's layout and table models. Locally they are skipped
      # when the models cannot be downloaded; in CI a missing model is an error.
      AVTALSAGENT_REQUIRE_MODELS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Cache Docling's models downloaded from Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('uv.lock') }}
      - run: uv sync --locked
      - run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up -d postgres --wait
      - name: Check that pgvector is installed
        run: >
          docker compose exec -T postgres
          psql -U avtalsagent -d avtalsagent -tAc
          "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
          | grep -E '^[0-9]+\.[0-9]+'
      - if: always()
        run: docker compose down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Starts the mock agent and the built app, then runs the browser tests against them.
      - run: npm run test:e2e

  web-docker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: docker compose -f compose.mock.yaml up -d --build --wait
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The same browser tests, against the containers instead of a local build.
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: always()
        run: docker compose -f compose.mock.yaml down
